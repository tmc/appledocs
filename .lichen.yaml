# Lichen configuration for license compliance checking

# Allowed licenses
allow:
  - "MIT"
  - "Apache-2.0"
  - "BSD-3-Clause"
  - "BSD-2-Clause"
  - "ISC"
  - "MPL-2.0"

# Explicitly forbidden licenses
deny:
  - "GPL-2.0"
  - "GPL-3.0"
  - "AGPL-3.0"
  - "LGPL-2.1"
  - "LGPL-3.0"
  - "CC-BY-NC-*"
  - "CC-BY-SA-*"
  - "CC-BY-ND-*"

# Packages to ignore (e.g., test dependencies)
ignore:
  - "github.com/tmc/appledocs/*"  # Ignore our own packages

# Override license detection for specific packages
# override:
#   - path: "github.com/example/package"
#     license: "MIT"