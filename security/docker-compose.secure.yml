version: '3.8'

services:
  appledocs:
    image: appledocs:secure
    container_name: appledocs-secure
    
    # Security options
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined  # Or use custom seccomp profile
      - apparmor:docker-default  # Or custom AppArmor profile
    
    # Drop all capabilities and add only what's needed
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # Only if binding to privileged ports
    
    # Read-only root filesystem
    read_only: true
    
    # Temporary filesystems for writable areas
    tmpfs:
      - /tmp:noexec,nosuid,size=100M
      - /run:noexec,nosuid,size=10M
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 100
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # User (must match Dockerfile)
    user: "1001:1001"
    
    # Environment variables
    environment:
      - LOG_LEVEL=info
      - HTTP_TIMEOUT=30s
      - MAX_DOWNLOAD_SIZE=100MB
    
    # Volumes with specific mount options
    volumes:
      - type: volume
        source: appledocs-cache
        target: /app/cache
        volume:
          nocopy: true
        read_only: false
      - type: volume
        source: appledocs-output
        target: /app/output
        volume:
          nocopy: true
        read_only: false
    
    # Network configuration
    networks:
      - appledocs-net
    
    # Health check
    healthcheck:
      test: ["CMD", "/appledocs", "-version"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    
    # Restart policy
    restart: unless-stopped
    
    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=appledocs,security=high"
    
    # Runtime constraints
    ulimits:
      nproc: 100
      nofile:
        soft: 1024
        hard: 2048
    
    # DNS configuration (optional)
    dns:
      - 8.8.8.8
      - 8.8.4.4
    
    # Labels for additional metadata
    labels:
      - "com.appledocs.security=high"
      - "com.appledocs.version=${VERSION:-latest}"

# Volumes with security considerations
volumes:
  appledocs-cache:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1g,uid=1001,gid=1001
  
  appledocs-output:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/output
      o: bind,uid=1001,gid=1001

# Network with security isolation
networks:
  appledocs-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
      com.docker.network.bridge.enable_ip_masquerade: "true"