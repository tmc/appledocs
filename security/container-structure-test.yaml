# Container Structure Tests for appledocs
# Tests to validate the security and structure of container images

schemaVersion: 2.0.0

# Metadata tests
metadataTest:
  env:
    - key: USER
      value: "appuser|nonroot|1001"
      regex: true
  labels:
    - key: "security.scan"
      value: "true"
    - key: "security.nonroot"
      value: "true"
  entrypoint: ["/appledocs"]
  workdir: "/app"
  user: "!root"  # Ensure not running as root

# File existence tests
fileExistenceTests:
  # Binary should exist
  - name: "Application binary exists"
    path: "/appledocs"
    shouldExist: true
    permissions: "-r-xr-xr-x"
    uid: 1001
    gid: 1001

  # SSL certificates should exist
  - name: "CA certificates exist"
    path: "/etc/ssl/certs/ca-certificates.crt"
    shouldExist: true

  # App directories should exist
  - name: "Cache directory exists"
    path: "/app/cache"
    shouldExist: true
    isDirectory: true
    permissions: "drwxr-xr-x"

  - name: "Output directory exists"
    path: "/app/output"
    shouldExist: true
    isDirectory: true
    permissions: "drwxr-xr-x"

  # Security: No shell should exist in scratch image
  - name: "No shell in scratch image"
    path: "/bin/sh"
    shouldExist: false

  - name: "No bash in scratch image"
    path: "/bin/bash"
    shouldExist: false

  # No package managers
  - name: "No apt"
    path: "/usr/bin/apt"
    shouldExist: false

  - name: "No apk"
    path: "/sbin/apk"
    shouldExist: false

# File content tests
fileContentTests:
  # Ensure passwd file has non-root user
  - name: "Non-root user exists"
    path: "/etc/passwd"
    expectedContents:
      - "appuser.*:1001:1001:"
    excludedContents:
      - "root:x:0:0:"  # Root user should not exist in scratch

# Command tests
commandTests:
  # Test that the binary runs
  - name: "Binary executes"
    command: "/appledocs"
    args: ["-version"]
    exitCode: 0

  # Test help command
  - name: "Help command works"
    command: "/appledocs"
    args: ["-help"]
    exitCode: 0

  # Security: Ensure running as non-root
  - name: "Running as non-root user"
    command: "id"
    args: ["-u"]
    expectedOutput: ["1001|65532"]  # 1001 for custom user, 65532 for distroless nonroot

  # Security: No sudo available
  - name: "No sudo command"
    command: "sudo"
    exitCode: 127  # Command not found

  # Security: Limited capabilities
  - name: "No dangerous capabilities"
    command: "capsh"
    args: ["--print"]
    excludedOutput:
      - "cap_sys_admin"
      - "cap_sys_ptrace"
      - "cap_dac_override"

# License tests
licenseTests:
  - debian: false  # Not a Debian-based image
    files: []  # No license files expected in scratch

# Security configuration tests
configTests:
  - name: "Read-only root filesystem"
    setup:
      - ["touch", "/test-file"]
    expectedError: "Read-only file system"

  - name: "Non-executable tmp"
    setup:
      - ["cp", "/appledocs", "/tmp/test-binary"]
      - ["chmod", "+x", "/tmp/test-binary"]
      - ["/tmp/test-binary"]
    expectedError: "Permission denied"

  - name: "Resource limits enforced"
    command: "ulimit"
    args: ["-n"]
    expectedOutput: ["1024|2048"]  # File descriptor limits