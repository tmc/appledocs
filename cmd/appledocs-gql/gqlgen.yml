# GraphQL schema source
schema:
  - schema.graphql

# Where to put the generated files
exec:
  filename: gql/generated.go
  package: gql

# Custom resolver implementation package
resolver:
  layout: follow-schema
  dir: gql
  package: gql

# Let gqlgen generate models based on schema
models:
  Document:
    model: github.com/tmc/appledocs/lib/doc.Document
  
  JSON:
    model:
      - github.com/graphql-go/graphql.type

# Automatically generate models for all other types
autobind:
  - github.com/tmc/appledocs/lib/doc

# Optional: turn on use `gqlgen:"fieldName"` tags in your models
# struct_tag: json

# Optional: turn on to use []Thing instead of []*Thing
# omit_slice_element_pointers: false

# Optional: set to speed up generation time by not performing a final validation pass.
# skip_validation: true

# gqlgen will search for any type names in the schema in these go packages
# if they match it will use them, otherwise it will generate them.