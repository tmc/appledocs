# Configuration for framework binding generation
#
# Note: Deprecation status and iOS-only detection are now automatically extracted
# from Apple's framework documentation metadata. Manual deprecation_reason entries
# are no longer needed and will be overridden by auto-detected values.

# Unsafe selectors for test generation
# These are methods that crash when called on bare NSObject instances
# because they come from categories/protocols meant to be overridden
#
# Patterns are regular expressions matched against lowercased selector names
unsafe_selector_patterns:
  - ^accessibility        # Accessibility protocol methods
  - ^webplugin           # WebPlugIn protocol methods
  - ^image               # Image browser protocol methods
  - ^action              # Action protocol methods
  - ^browser             # Browser protocol methods
  - ^file                # File transfer protocol methods
  - ^awake               # Nib loading methods
  - ^commit              # Editor protocol methods
  - ^discard             # Editor protocol methods
  - ^prepare             # Interface Builder methods
  - ^ignoremodifier      # Drag protocol methods
  - ^getl2cap            # Bluetooth protocol methods
  - ^finalizeforwebscript$  # WebScript protocol method (exact match)

frameworks:
  Foundation:
    # Classes that should not have test examples generated (e.g., require parameters)
    exclude_test_examples:
      - NSUserActivity  # Requires activityType parameter
      - NSPredicate  # Crashes with invalid format string parameter
    exclude_test_patterns:
      - "^ExampleNewNotification$"  # NSNotification requires name parameter, crashes with empty notification
  AppKit:
    exclude_test_examples:
      - NSFilePromiseProvider  # Requires valid NSFilePromiseProviderDelegate implementation with writePromiseToURL: method
  ObjectiveC:
    exclude_test_examples: []
  CloudKit:
    exclude_test_patterns:
      - "^ExampleNewCKContainerWithIdentifier$"  # CKContainer requires CloudKit entitlements and container configuration
      - "^ExampleNewCKOperation$"  # CKOperation is an abstract class that cannot be instantiated directly
  CoreImage:
    exclude_test_patterns:
      - "^ExampleNewContextWithMTLCommandQueue$"  # Requires Metal command queue which needs GPU access
  QuartzCore:
    exclude_test_examples:
      - CAAnimation  # Causes crash with nil keyPath parameter
      - CAPropertyAnimation  # Causes crash with keyPath parameter
  UserNotifications:
    exclude_test_examples:
      - UNTimeIntervalNotificationTrigger  # Requires timeInterval > 0, default value of 0 causes crash
