# GolangCI-Lint Configuration for appledocs

run:
  timeout: 10m
  tests: true
  build-tags:
    - integration
  skip-dirs:
    - vendor
    - third_party
    - testdata
  skip-files:
    - ".*_test.go"
    - "mock_.*go"

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters:
  enable-all: true
  disable:
    - maligned # deprecated
    - interfacer # deprecated
    - scopelint # deprecated
    - golint # deprecated
    - exhaustivestruct # too strict
    - exhaustruct # too strict
    - ireturn # too strict for this project
    - varnamelen # too strict
    - wrapcheck # too strict
    - nlreturn # style preference
    - wsl # style preference
    - gochecknoglobals # we use some globals
    - paralleltest # not needed for all tests
    - testpackage # we prefer same package tests
    - tparallel # not needed for all tests
    - depguard # using default allowed packages

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
    exclude-functions:
      - io.Copy
      - io.WriteString
      - (io.Closer).Close

  govet:
    enable-all: true
    shadow: true

  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/tmc/appledocs

  gocyclo:
    min-complexity: 20

  gocognit:
    min-complexity: 40

  dupl:
    threshold: 150

  goconst:
    min-len: 3
    min-occurrences: 3

  gosec:
    severity: low
    confidence: low
    excludes:
      - G104 # Audit errors not checked
      - G304 # File path provided as argument

  lll:
    line-length: 120
    tab-width: 4

  misspell:
    locale: US

  nakedret:
    max-func-lines: 40

  prealloc:
    simple: true
    range-loops: true
    for-loops: true

  unparam:
    check-exported: true

  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
      - experimental
    disabled-checks:
      - unnamedResult
      - hugeParam
      - rangeValCopy

  gomnd:
    checks:
      - argument
      - case
      - condition
      - operation
      - return
      - assign
    ignored-numbers:
      - '0'
      - '1'
      - '2'
      - '10'
      - '100'

  revive:
    confidence: 0.8
    severity: warning
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unused-parameter
      - name: unreachable-code
      - name: redefines-builtin-id

  staticcheck:
    checks: ["all", "-ST1000", "-ST1003", "-ST1016"]

  stylecheck:
    checks: ["all", "-ST1000", "-ST1003", "-ST1016"]
    dot-import-whitelist:
      - fmt

  funlen:
    lines: 100
    statements: 60

  godot:
    scope: declarations
    capital: true
    period: true

  godox:
    keywords:
      - TODO
      - FIXME
      - HACK
      - BUG
      - XXX

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - funlen
        - godot

    # Exclude known issues in third-party packages
    - path: vendor/
      linters:
        - typecheck
        - unused
        - gosimple
        - ineffassign

    # Exclude some linters on main.go
    - path: main\.go
      linters:
        - gochecknoglobals

    # Allow TODO comments in certain files
    - path: '(.*)?_test\.go'
      linters:
        - godox

  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

  # Show all issues from a linter
  exclude:
    # errcheck: Almost all programs ignore errors on these functions
    - Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*printf?|os\.(Un)?Setenv). is not checked

    # golint: Exported variables are used for configuration
    - exported (type|method|function|var) (.+) should have comment or be unexported

    # govet: Common false positives
    - (possible misuse of unsafe.Pointer|should have signature)

    # megacheck: Developers tend to write in C-style with an explicit 'break' in a 'switch'
    - ineffective break statement. Did you mean to break out of the outer loop

    # gas: Too many false positives for file inclusion
    - Potential file inclusion via variable

    # Ignore missing comments on exported functions in main package
    - exported function `main` should have comment or be unexported

severity:
  default-severity: warning
  rules:
    - linters:
        - gosec
      severity: error
    - linters:
        - dupl
      severity: info